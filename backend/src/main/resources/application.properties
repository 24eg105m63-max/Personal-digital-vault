spring.config.import=optional:file:.env[.properties]
spring.application.name=common-campus-events
server.port=${SERVER_PORT:8080}

# MySQL configuration
# Set MYSQL_USERNAME / MYSQL_PASSWORD in your environment if your local MySQL user is not root.
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${MYSQL_USERNAME}
spring.datasource.password=${MYSQL_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:false}

# File upload configuration
app.upload.dir=${UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# JWT configuration
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION_MS:86400000}

# First administrator account for local development; override both values in deployment.
app.admin.email=${ADMIN_EMAIL}
app.admin.password=${ADMIN_PASSWORD}
app.admin.name=${ADMIN_NAME}
app.admin.phone=${ADMIN_PHONE}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
app.credential.encryption-key=${CREDENTIAL_ENCRYPTION_KEY}
